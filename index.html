<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>13 — לוח ניקוד</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Heebo:wght@300;400;500;700;900&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0b1a;
    --bg-soft: #15112a;
    --card: #1c1638;
    --card-hover: #251e47;
    --border: #2d2554;
    --ink: #f5f1e8;
    --ink-dim: #a39db8;
    --gold: #e8c547;
    --gold-soft: #b89a35;
    --crimson: #d64545;
    --teal: #4ecdc4;
    --violet: #9d7cd8;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --glow-gold: 0 0 24px rgba(232, 197, 71, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(157, 124, 216, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(232, 197, 71, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(78, 205, 196, 0.05) 0%, transparent 70%);
  }

  #root { min-height: 100vh; }

  /* Decorative card suit symbols floating */
  .deco-symbol {
    position: fixed;
    font-size: 180px;
    opacity: 0.025;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .title {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1;
    background: linear-gradient(135deg, var(--gold) 0%, var(--crimson) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }

  .subtitle {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 14px;
    color: var(--ink-dim);
    font-weight: 400;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* Buttons */
  button {
    font-family: 'Heebo', sans-serif;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }

  .btn {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 0.3px;
  }

  .btn:hover { background: var(--card-hover); border-color: var(--gold-soft); }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
    color: #1a1530;
    font-weight: 700;
    border: none;
    box-shadow: var(--glow-gold);
  }

  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled {
    background: var(--card);
    color: var(--ink-dim);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .btn-danger { color: var(--crimson); border-color: rgba(214, 69, 69, 0.3); }
  .btn-danger:hover { background: rgba(214, 69, 69, 0.1); border-color: var(--crimson); }

  /* Setup screen */
  .setup {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: var(--shadow);
  }

  .setup-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--gold);
  }

  .player-input {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .player-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #1a1530;
    flex-shrink: 0;
  }

  input[type="text"], input[type="number"] {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Heebo', sans-serif;
    font-size: 16px;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  input[type="number"] {
    width: 80px;
    flex: none;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* Round badge */
  .round-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .round-info::before {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--gold), var(--crimson));
  }

  .round-label {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 13px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .round-number {
    font-family: 'Bungee', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--gold);
  }

  .round-cards {
    font-size: 14px;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  /* Bid/Score rows */
  .player-rows {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  .player-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
  }

  .player-row.dealer {
    border-color: var(--gold-soft);
    background: linear-gradient(135deg, var(--card) 0%, rgba(232, 197, 71, 0.05) 100%);
  }

  .player-name {
    font-weight: 500;
    font-size: 16px;
  }

  .player-meta {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .dealer-tag {
    display: inline-block;
    background: var(--gold);
    color: #1a1530;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    margin-right: 6px;
    letter-spacing: 0.5px;
  }

  .player-total {
    font-family: 'Bungee', sans-serif;
    font-size: 28px;
    color: var(--gold);
    min-width: 60px;
    text-align: center;
  }

  .player-total.zero { color: var(--ink-dim); }

  .number-control {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .number-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-soft);
    color: var(--ink);
    border: 1px solid var(--border);
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .number-btn:hover:not(:disabled) {
    background: var(--card-hover);
    border-color: var(--gold-soft);
  }

  .number-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .number-display {
    min-width: 44px;
    height: 36px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
  }

  .number-display.highlight {
    border-color: var(--gold);
    color: var(--gold);
  }

  .number-display.success {
    border-color: var(--teal);
    color: var(--teal);
    background: rgba(78, 205, 196, 0.1);
  }

  .number-display.fail {
    border-color: var(--crimson);
    color: var(--crimson);
    background: rgba(214, 69, 69, 0.08);
  }

  /* Bid sum indicator */
  .bid-sum {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 14px;
  }

  .bid-sum.forbidden {
    border-color: var(--crimson);
    background: rgba(214, 69, 69, 0.08);
  }

  .bid-sum.ok {
    border-color: var(--teal);
    background: rgba(78, 205, 196, 0.05);
  }

  .bid-sum.over {
    border-color: var(--violet);
    background: rgba(157, 124, 216, 0.12);
  }

  .bid-sum.under {
    border-color: var(--gold-soft);
    background: rgba(232, 197, 71, 0.1);
  }

  .bid-sum.over .bid-sum-value { color: var(--violet); }
  .bid-sum.under .bid-sum-value { color: var(--gold); }

  .over-under-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-family: 'Bungee', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    margin-right: 8px;
  }

  .over-under-tag.over {
    background: rgba(157, 124, 216, 0.2);
    color: var(--violet);
    border: 1px solid var(--violet);
  }

  .over-under-tag.under {
    background: rgba(232, 197, 71, 0.15);
    color: var(--gold);
    border: 1px solid var(--gold-soft);
  }

  .bid-sum-value {
    font-family: 'Bungee', sans-serif;
    font-size: 20px;
  }

  .bid-sum.forbidden .bid-sum-value { color: var(--crimson); }
  .bid-sum.ok .bid-sum-value { color: var(--teal); }

  .bid-sum-hint {
    font-size: 12px;
    color: var(--ink-dim);
  }

  /* Phase tabs */
  .phase-bar {
    display: flex;
    gap: 4px;
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .phase-tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    color: var(--ink-dim);
    border: none;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.2s;
  }

  .phase-tab.active {
    background: var(--card);
    color: var(--gold);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .phase-tab.done {
    color: var(--teal);
  }

  /* Actions bar */
  .actions {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
  }

  /* History table */
  .history {
    margin-top: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }

  .history-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 16px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 400px;
  }

  th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  th {
    font-weight: 500;
    color: var(--ink-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  td.bid-cell {
    color: var(--ink-dim);
    font-size: 12px;
  }

  td.score-cell {
    font-weight: 700;
  }

  td.fail-cell { color: var(--crimson); }
  td.success-cell { color: var(--teal); }

  tr.total-row {
    background: var(--bg-soft);
    font-weight: 700;
  }

  tr.total-row td {
    border-bottom: none;
    font-family: 'Bungee', sans-serif;
    font-size: 18px;
    color: var(--gold);
    padding: 14px 8px;
  }

  /* Tissue alert */
  .tissue-alert {
    background: linear-gradient(135deg, rgba(214, 69, 69, 0.15) 0%, rgba(232, 197, 71, 0.1) 100%);
    border: 2px solid var(--crimson);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: shake 0.5s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-0.5deg); }
    75% { transform: translateX(4px) rotate(0.5deg); }
  }

  .tissue-alert .emoji {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .tissue-alert h2 {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 22px;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .tissue-alert p {
    font-size: 16px;
    color: var(--ink);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .tissue-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* Repeats indicator */
  .repeats-pill {
    display: inline-block;
    background: rgba(157, 124, 216, 0.15);
    color: var(--violet);
    border: 1px solid rgba(157, 124, 216, 0.3);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
    letter-spacing: 0.5px;
  }

  /* Winner banner */
  .winner-banner {
    background: linear-gradient(135deg, var(--gold) 0%, var(--crimson) 100%);
    color: #1a1530;
    padding: 32px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--glow-gold);
  }

  .winner-banner h2 {
    font-family: 'Bungee', sans-serif;
    font-size: 32px;
    margin-bottom: 8px;
  }

  .winner-banner p {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 18px;
    opacity: 0.85;
  }

  /* Mobile */
  @media (max-width: 640px) {
    .app { padding: 16px 12px 40px; }
    .player-row {
      grid-template-columns: 1fr auto;
      gap: 12px;
    }
    .player-row > .player-info { grid-column: 1 / -1; order: -1; }
    .player-row > .player-total { order: 3; }
    .player-row > .number-control { order: 2; justify-self: end; }
    .round-info { padding: 16px 20px; }
    .round-number { font-size: 36px; }
    th, td { padding: 8px 4px; font-size: 12px; }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .player-row, .round-info, .bid-sum {
    animation: slideIn 0.3s ease;
  }
</style>
</head>
<body>
  <div class="deco-symbol" style="top: 10%; left: 5%;">♠</div>
  <div class="deco-symbol" style="top: 60%; right: 8%;">♥</div>
  <div class="deco-symbol" style="bottom: 5%; left: 15%;">♦</div>
  <div class="deco-symbol" style="top: 30%; right: 25%;">♣</div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PLAYER_COLORS = ['#e8c547', '#4ecdc4', '#9d7cd8', '#ff8c61', '#5dade2'];
    const STORAGE_KEY = 'thirteen-game-v1';

    // Calculate score: 0 if failed, otherwise:
    // - Special case: bid 0 on round 13 with under sum → 50, with over → 25
    // - Otherwise: 10 + bid²
    const calcScore = (bid, taken, cardsInRound, bidsSum) => {
      if (bid === null || taken === null) return null;
      if (bid !== taken) return 0;
      if (cardsInRound === 13 && bid === 0) {
        const isUnder = bidsSum < cardsInRound;
        return isUnder ? 50 : 25;
      }
      return 10 + bid * bid;
    };

    function App() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            // Migration: ensure new fields exist for games saved before these features
            if (parsed && typeof parsed === 'object') {
              if (parsed.finalRepeats === undefined) parsed.finalRepeats = 1;
              if (parsed.currentRepeat === undefined) parsed.currentRepeat = 1;
              if (parsed.showTissueAlert === undefined) parsed.showTissueAlert = false;
              if (parsed.tissueAcknowledged === undefined) parsed.tissueAcknowledged = true;
              // Sanity: must have players array
              if (!Array.isArray(parsed.players) || parsed.players.length === 0) {
                return null;
              }
              return parsed;
            }
          }
        } catch (e) {
          console.warn('Failed to load saved game, starting fresh:', e);
        }
        return null;
      });

      useEffect(() => {
        if (state) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }
      }, [state]);

      if (!state) {
        return <Setup onStart={setState} />;
      }

      return <Game state={state} setState={setState} onReset={() => {
        localStorage.removeItem(STORAGE_KEY);
        setState(null);
      }} />;
    }

    function Setup({ onStart }) {
      const [names, setNames] = useState(['', '', '', '']);
      const [maxRound, setMaxRound] = useState(13);
      const [finalRepeats, setFinalRepeats] = useState(1);

      const start = () => {
        const finalNames = names.map((n, i) => n.trim() || `שחקן ${i + 1}`);
        // Check if any player is named "yuval" (case-insensitive, Hebrew or English)
        const hasYuval = finalNames.some(n => {
          const lower = n.toLowerCase().trim();
          return lower === 'yuval' || lower === 'יובל';
        });

        onStart({
          players: finalNames,
          maxRound: maxRound,
          finalRepeats: finalRepeats,
          currentRound: 1,
          currentRepeat: 1, // which repeat of the final round we're on
          dealerIndex: 0,
          phase: 'bidding',
          rounds: [],
          currentBids: [0, 0, 0, 0],
          currentTakes: [0, 0, 0, 0],
          showTissueAlert: hasYuval,
          tissueAcknowledged: false,
        });
      };

      return (
        <div className="app">
          <header className="header">
            <div>
              <h1 className="title">13</h1>
              <div className="subtitle">לוח ניקוד ל"הכרזות" — וריאציה ישראלית של ויסט</div>
            </div>
          </header>

          <div className="setup">
            <h2 className="setup-title">משחק חדש</h2>
            {names.map((n, i) => (
              <div key={i} className="player-input">
                <div className="player-badge" style={{ background: PLAYER_COLORS[i] }}>
                  {i + 1}
                </div>
                <input
                  type="text"
                  placeholder={`שם שחקן ${i + 1}`}
                  value={n}
                  onChange={(e) => {
                    const newNames = [...names];
                    newNames[i] = e.target.value;
                    setNames(newNames);
                  }}
                />
              </div>
            ))}

            <div style={{ marginTop: 24, marginBottom: 16 }}>
              <label style={{ fontSize: 14, color: 'var(--ink-dim)', display: 'block', marginBottom: 8 }}>
                מספר סיבובים (קלפים מקסימלי)
              </label>
              <input
                type="number"
                min="1"
                max="13"
                value={maxRound}
                onChange={(e) => setMaxRound(Math.max(1, Math.min(13, parseInt(e.target.value) || 1)))}
              />
            </div>

            <div style={{ marginBottom: 20 }}>
              <label style={{ fontSize: 14, color: 'var(--ink-dim)', display: 'block', marginBottom: 8 }}>
                כמה פעמים חוזרים על הסיבוב האחרון ({maxRound} קלפים)
              </label>
              <input
                type="number"
                min="1"
                max="10"
                value={finalRepeats}
                onChange={(e) => setFinalRepeats(Math.max(1, Math.min(10, parseInt(e.target.value) || 1)))}
              />
              <div style={{ fontSize: 12, color: 'var(--ink-dim)', marginTop: 6 }}>
                סה״כ {maxRound - 1 + finalRepeats} סיבובים במשחק
              </div>
            </div>

            <button className="btn btn-primary" onClick={start} style={{ width: '100%', padding: 14, fontSize: 16 }}>
              התחל משחק
            </button>
          </div>
        </div>
      );
    }

    function Game({ state, setState, onReset }) {
      const { players, currentRound, currentRepeat, maxRound, finalRepeats, dealerIndex, phase, rounds, currentBids, currentTakes, showTissueAlert, tissueAcknowledged } = state;
      const cardsInRound = Math.min(currentRound, maxRound);
      const isAtMaxRound = currentRound >= maxRound;
      const repeats = finalRepeats || 1;
      const repeatNum = currentRepeat || 1;
      // Game is finished when we've completed the last repeat of the max round
      const isLastRound = currentRound > maxRound || (currentRound === maxRound && repeatNum > repeats);

      const acknowledgeTissues = () => {
        setState({ ...state, tissueAcknowledged: true });
      };

      // Totals across all completed rounds
      const totals = useMemo(() => {
        const t = players.map(() => 0);
        rounds.forEach(r => {
          r.scores.forEach((s, i) => { t[i] += s; });
        });
        return t;
      }, [players, rounds]);

      const bidSum = currentBids.reduce((a, b) => a + (b ?? 0), 0);
      const bidsValid = bidSum !== cardsInRound;

      const takeSum = currentTakes.reduce((a, b) => a + (b ?? 0), 0);
      const takesValid = takeSum === cardsInRound;

      // The dealer (last to bid) is constrained
      const forbiddenBidForDealer = useMemo(() => {
        // Sum of all OTHER players' bids
        let sumOthers = 0;
        let dealerBidCounted = false;
        currentBids.forEach((b, i) => {
          if (i !== dealerIndex && b !== null) sumOthers += b;
          if (i === dealerIndex && b !== null) dealerBidCounted = true;
        });
        const othersAllSet = currentBids.every((b, i) => i === dealerIndex || b !== null);
        if (!othersAllSet) return null;
        // dealer's forbidden bid: one that would make total === cardsInRound
        const forbidden = cardsInRound - sumOthers;
        if (forbidden < 0) return null;
        if (forbidden > cardsInRound) return null;
        return forbidden;
      }, [currentBids, dealerIndex, cardsInRound]);

      const updateBid = (idx, delta) => {
        const newBids = [...currentBids];
        const current = newBids[idx] ?? 0;
        const next = current + delta;
        if (next < 0 || next > cardsInRound) return;
        newBids[idx] = next;
        setState({ ...state, currentBids: newBids });
      };

      const setBid = (idx, value) => {
        const newBids = [...currentBids];
        newBids[idx] = value;
        setState({ ...state, currentBids: newBids });
      };

      const updateTake = (idx, delta) => {
        const newTakes = [...currentTakes];
        const current = newTakes[idx] ?? 0;
        const next = current + delta;
        if (next < 0 || next > cardsInRound) return;
        newTakes[idx] = next;
        setState({ ...state, currentTakes: newTakes });
      };

      const setTake = (idx, value) => {
        const newTakes = [...currentTakes];
        newTakes[idx] = value;
        setState({ ...state, currentTakes: newTakes });
      };

      const goToResults = () => {
        // Initialize takes to 0
        const initTakes = currentBids.map(() => 0);
        setState({ ...state, phase: 'results', currentTakes: initTakes });
      };

      const goBackToBidding = () => {
        setState({ ...state, phase: 'bidding', currentTakes: [0, 0, 0, 0] });
      };

      const finishRound = () => {
        const bidsSumLocal = currentBids.reduce((a, b) => a + b, 0);
        const scores = currentBids.map((b, i) => calcScore(b, currentTakes[i], cardsInRound, bidsSumLocal));
        const newRound = {
          round: currentRound,
          repeat: repeatNum,
          totalRepeats: isAtMaxRound ? repeats : 1,
          cards: cardsInRound,
          bids: [...currentBids],
          takes: [...currentTakes],
          scores: scores,
        };

        // Determine next round/repeat
        let nextRound = currentRound;
        let nextRepeat = repeatNum;
        if (isAtMaxRound && repeatNum < repeats) {
          // Stay on max round, increment repeat
          nextRepeat = repeatNum + 1;
        } else {
          // Move to next round, reset repeat
          nextRound = currentRound + 1;
          nextRepeat = 1;
        }

        const nextDealer = (dealerIndex + 1) % players.length;
        setState({
          ...state,
          rounds: [...rounds, newRound],
          currentRound: nextRound,
          currentRepeat: nextRepeat,
          dealerIndex: nextDealer,
          phase: 'bidding',
          currentBids: [0, 0, 0, 0],
          currentTakes: [0, 0, 0, 0],
        });
      };

      const undoLastRound = () => {
        if (rounds.length === 0) return;
        if (!confirm('לבטל את הסיבוב האחרון?')) return;
        const newRounds = rounds.slice(0, -1);
        const lastRound = rounds[rounds.length - 1];
        setState({
          ...state,
          rounds: newRounds,
          currentRound: lastRound.round,
          currentRepeat: lastRound.repeat || 1,
          dealerIndex: (dealerIndex - 1 + players.length) % players.length,
          phase: 'bidding',
          currentBids: [0, 0, 0, 0],
          currentTakes: [0, 0, 0, 0],
        });
      };

      const resetAll = () => {
        if (!confirm('להתחיל משחק חדש? כל הנתונים יימחקו.')) return;
        onReset();
      };

      // Tissue alert — shown before anything else if yuval is playing
      if (showTissueAlert && !tissueAcknowledged) {
        return (
          <div className="app">
            <header className="header">
              <div>
                <h1 className="title">13</h1>
                <div className="subtitle">רגע לפני שמתחילים...</div>
              </div>
            </header>

            <div className="tissue-alert">
              <div className="emoji">🤧😭🧻</div>
              <h2>שאלה חשובה!</h2>
              <p>
                האם כולם <strong>חוץ מיובל</strong> הביאו ממחטות לנגב את הדמעות?
              </p>
              <div className="tissue-actions">
                <button className="btn btn-primary" onClick={acknowledgeTissues}>
                  כן, אנחנו מוכנים 💪
                </button>
                <button className="btn" onClick={acknowledgeTissues}>
                  לא, אבל בוא נתחיל בכל זאת
                </button>
              </div>
            </div>

            <div style={{ textAlign: 'center', color: 'var(--ink-dim)', fontSize: 14 }}>
              בהצלחה לכולם 🃏
            </div>
          </div>
        );
      }

      // Game finished
      if (isLastRound) {
        const maxScore = Math.max(...totals);
        const winnerIdx = totals.indexOf(maxScore);
        return (
          <div className="app">
            <header className="header">
              <div>
                <h1 className="title">13</h1>
                <div className="subtitle">המשחק הסתיים!</div>
              </div>
              <div className="header-actions">
                <button className="btn btn-danger" onClick={resetAll}>משחק חדש</button>
              </div>
            </header>

            <div className="winner-banner">
              <h2>🏆 {players[winnerIdx]}</h2>
              <p>{maxScore} נקודות</p>
            </div>

            <HistoryTable players={players} rounds={rounds} totals={totals} />
          </div>
        );
      }

      return (
        <div className="app">
          <header className="header">
            <div>
              <h1 className="title">13</h1>
              <div className="subtitle">לוח ניקוד — הכרזות</div>
            </div>
            <div className="header-actions">
              {rounds.length > 0 && (
                <button className="btn" onClick={undoLastRound}>↶ בטל סיבוב</button>
              )}
              <button className="btn btn-danger" onClick={resetAll}>משחק חדש</button>
            </div>
          </header>

          <div className="round-info">
            <div>
              <div className="round-label">
                סיבוב
                {isAtMaxRound && repeats > 1 && (
                  <span className="repeats-pill">חזרה {repeatNum}/{repeats}</span>
                )}
              </div>
              <div className="round-number">{cardsInRound}</div>
              <div className="round-cards">{cardsInRound} {cardsInRound === 1 ? 'קלף' : 'קלפים'} לכל שחקן</div>
            </div>
            <div style={{ textAlign: 'left' }}>
              <div className="round-label">מחלק</div>
              <div style={{ fontSize: 20, fontWeight: 700, marginTop: 4, color: PLAYER_COLORS[dealerIndex] }}>
                {players[dealerIndex]}
              </div>
            </div>
          </div>

          <div className="phase-bar">
            <button
              className={`phase-tab ${phase === 'bidding' ? 'active' : 'done'}`}
              onClick={() => phase === 'results' && goBackToBidding()}
            >
              {phase === 'results' && '✓ '}1. הכרזות
            </button>
            <button
              className={`phase-tab ${phase === 'results' ? 'active' : ''}`}
              disabled={phase !== 'results'}
              style={{ cursor: phase === 'results' ? 'default' : 'not-allowed' }}
            >
              2. תוצאות
            </button>
          </div>

          {phase === 'bidding' ? (
            <>
              <div className="player-rows">
                {players.map((name, i) => {
                  const isDealer = i === dealerIndex;
                  const otherSum = currentBids.reduce((sum, b, j) => j === i ? sum : sum + (b ?? 0), 0);
                  const othersAllSet = currentBids.every((b, j) => j === i || b !== null);
                  const forbidden = (isDealer && othersAllSet) ? cardsInRound - otherSum : null;
                  return (
                    <div key={i} className={`player-row ${isDealer ? 'dealer' : ''}`}>
                      <div className="player-badge" style={{ background: PLAYER_COLORS[i] }}>{i + 1}</div>
                      <div className="player-info">
                        <div className="player-name">
                          {isDealer && <span className="dealer-tag">מחלק</span>}
                          {name}
                        </div>
                        {forbidden !== null && forbidden >= 0 && forbidden <= cardsInRound && (
                          <div className="player-meta">
                            ⚠ אסור להכריז {forbidden}
                          </div>
                        )}
                      </div>
                      <div className="number-control">
                        <button
                          className="number-btn"
                          onClick={() => updateBid(i, -1)}
                          disabled={currentBids[i] <= 0}
                        >−</button>
                        <div className="number-display">
                          {currentBids[i]}
                        </div>
                        <button
                          className="number-btn"
                          onClick={() => updateBid(i, 1)}
                          disabled={currentBids[i] >= cardsInRound}
                        >+</button>
                      </div>
                      <div className={`player-total ${totals[i] === 0 ? 'zero' : ''}`}>
                        {totals[i]}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className={`bid-sum ${bidsValid ? 'ok' : 'forbidden'}`}>
                <div>
                  <div>סכום ההכרזות: <span className="bid-sum-value">{bidSum}</span> / {cardsInRound}</div>
                  <div className="bid-sum-hint">
                    {bidsValid
                      ? `שונה מ-${cardsInRound} ✓ אפשר להמשיך`
                      : `חייב להיות שונה מ-${cardsInRound}`}
                  </div>
                </div>
              </div>

              <div className="actions">
                <button
                  className="btn btn-primary"
                  onClick={goToResults}
                  disabled={!bidsValid}
                  style={{ marginRight: 'auto' }}
                >
                  המשך לתוצאות ←
                </button>
              </div>
            </>
          ) : (
            <>
              {(() => {
                const bidsSumDisplay = currentBids.reduce((a, b) => a + b, 0);
                const isOver = bidsSumDisplay > cardsInRound;
                const diff = Math.abs(bidsSumDisplay - cardsInRound);
                return (
                  <div className={`bid-sum ${isOver ? 'over' : 'under'}`}>
                    <div>
                      <div>
                        <span className={`over-under-tag ${isOver ? 'over' : 'under'}`}>
                          {isOver ? 'OVER ⬆' : 'UNDER ⬇'}
                        </span>
                        סכום ההכרזות: <span className="bid-sum-value">{bidsSumDisplay}</span> / {cardsInRound}
                      </div>
                      <div className="bid-sum-hint">
                        {isOver
                          ? `יותר ב-${diff} — לפחות שחקן אחד לא יעמוד`
                          : `פחות ב-${diff} — לפחות שחקן אחד לא יעמוד`}
                      </div>
                    </div>
                  </div>
                );
              })()}

              <div className="player-rows">
                {players.map((name, i) => {
                  const isDealer = i === dealerIndex;
                  const bid = currentBids[i];
                  const taken = currentTakes[i];
                  const bidsSumLocal = currentBids.reduce((a, b) => a + b, 0);
                  const score = calcScore(bid, taken, cardsInRound, bidsSumLocal);
                  const matched = bid === taken;
                  return (
                    <div key={i} className={`player-row ${isDealer ? 'dealer' : ''}`}>
                      <div className="player-badge" style={{ background: PLAYER_COLORS[i] }}>{i + 1}</div>
                      <div className="player-info">
                        <div className="player-name">
                          {isDealer && <span className="dealer-tag">מחלק</span>}
                          {name}
                        </div>
                        <div className="player-meta">
                          הכריז {bid} · {matched ? `+${score} ✓` : 'לא עמד'}
                        </div>
                      </div>
                      <div className="number-control">
                        <button
                          className="number-btn"
                          onClick={() => updateTake(i, -1)}
                          disabled={currentTakes[i] <= 0}
                        >−</button>
                        <div className={`number-display ${matched ? 'success' : 'fail'}`}>
                          {taken}
                        </div>
                        <button
                          className="number-btn"
                          onClick={() => updateTake(i, 1)}
                          disabled={currentTakes[i] >= cardsInRound}
                        >+</button>
                      </div>
                      <div className={`player-total ${totals[i] === 0 ? 'zero' : ''}`}>
                        {totals[i]}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className={`bid-sum ${takesValid ? 'ok' : 'forbidden'}`}>
                <div>
                  <div>סכום הלקיחות: <span className="bid-sum-value">{takeSum}</span> / {cardsInRound}</div>
                  <div className="bid-sum-hint">
                    {takesValid
                      ? 'הסכום נכון ✓'
                      : `הסכום חייב להיות בדיוק ${cardsInRound}`}
                  </div>
                </div>
              </div>

              <div className="actions">
                <button className="btn" onClick={goBackToBidding}>← חזרה להכרזות</button>
                <button
                  className="btn btn-primary"
                  onClick={finishRound}
                  disabled={!takesValid}
                >
                  סיים סיבוב ←
                </button>
              </div>
            </>
          )}

          {rounds.length > 0 && (
            <HistoryTable players={players} rounds={rounds} totals={totals} />
          )}
        </div>
      );
    }

    function HistoryTable({ players, rounds, totals }) {
      return (
        <div className="history">
          <h3 className="history-title">היסטוריית סיבובים</h3>
          <table>
            <thead>
              <tr>
                <th>סיבוב</th>
                {players.map((p, i) => (
                  <th key={i} style={{ color: PLAYER_COLORS[i] }}>{p}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rounds.map((r, idx) => {
                const label = (r.totalRepeats && r.totalRepeats > 1)
                  ? `${r.round}·${r.repeat}`
                  : `${r.round}`;
                return (
                  <tr key={idx}>
                    <td style={{ fontWeight: 700, color: 'var(--ink-dim)' }}>{label}</td>
                    {players.map((_, i) => {
                      const success = r.bids[i] === r.takes[i];
                      return (
                        <td key={i}>
                          <div className="bid-cell">
                            {r.bids[i]}/{r.takes[i]}
                          </div>
                          <div className={`score-cell ${success ? 'success-cell' : 'fail-cell'}`}>
                            {success ? `+${r.scores[i]}` : '0'}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
              <tr className="total-row">
                <td>סה״כ</td>
                {totals.map((t, i) => (
                  <td key={i}>{t}</td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
